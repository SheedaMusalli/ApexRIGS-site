    <script>
      // Immediately suppress benign Vite dev-server WebSocket HMR disconnections and sandbox socket notices
      (function() {
        function isBenign(raw) {
          if (!raw) return false;
          if (typeof raw === 'object') {
            if (raw.onerror || raw.authorizationError !== undefined || raw._hadError !== undefined || raw._closeAfterHandlingError !== undefined) {
              return true;
            }
          }
          var msg = (typeof raw === 'string' ? raw : (raw && raw.message) || '') + '';
          return (
            msg.includes('senderOnError') ||
            msg.includes('authorizationError') ||
            msg.includes('WebSocket') ||
            msg.includes('websocket') ||
            msg.includes('closed without opened') ||
            msg.includes('[vite]') ||
            msg.includes('Failed to fetch') ||
            msg.includes('NetworkError') ||
            msg.includes('Load failed') ||
            msg.includes('The user aborted a request') ||
            msg.includes('AbortError')
          );
        }

        window.addEventListener('unhandledrejection', function(event) {
          if (isBenign(event.reason)) {
            event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('error', function(event) {
          if (isBenign(event.message) || isBenign(event.error)) {
            event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          }
        }, true);

        var origError = console.error;
        console.error = function() {
          for (var i = 0; i < arguments.length; i++) {
            if (isBenign(arguments[i])) return;
          }
          origError.apply(console, arguments);
        };

        var origWarn = console.warn;
        console.warn = function() {
          for (var i = 0; i < arguments.length; i++) {
            if (isBenign(arguments[i])) return;
          }
          origWarn.apply(console, arguments);
        };
      })();
    </script>
