<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#334155" stop-opacity="0.3" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#3B82F6" flood-opacity="0.3" />
    </filter>
  </defs>

  <rect width="600" height="600" rx="24" fill="url(#bg)" />
  <rect x="12" y="12" width="576" height="576" rx="20" fill="none" stroke="url(#borderGrad)" stroke-width="2" />

  <g opacity="0.06">
    <circle cx="300" cy="270" r="220" fill="#3B82F6" />
    <circle cx="300" cy="270" r="160" fill="#60A5FA" />
  </g>

  <!-- Brand Pill -->
  <g transform="translate(48, 48)">
    <rect x="0" y="0" width="130" height="34" rx="8" fill="#3B82F6" opacity="0.9" />
    <text x="65" y="22" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="13" fill="#FFFFFF" letter-spacing="1.5">
      DARKFLASH
    </text>
  </g>

  <!-- Category Tag -->
  <g transform="translate(430, 48)">
    <rect x="0" y="0" width="122" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="61" y="22" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="11" fill="#94a3b8" letter-spacing="1">
      CASING
    </text>
  </g>

  <!-- Center Artwork -->
  <g transform="translate(160, 130)" filter="url(#shadow)">
    <rect x="0" y="0" width="280" height="280" rx="20" fill="#0f172a" stroke="#3B82F6" stroke-width="2.5" />
    <circle cx="140" cy="140" r="85" fill="none" stroke="#60A5FA" stroke-width="4" stroke-dasharray="6,6" opacity="0.8" />
    <polygon points="140,75 195,175 85,175" fill="url(#glow)" opacity="0.7" />
    <circle cx="140" cy="140" r="40" fill="#020617" stroke="#3B82F6" stroke-width="3" />
    <text x="140" y="146" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="20" fill="#FFFFFF">
      DARK
    </text>
  </g>

  <!-- Bottom Details Container -->
  <rect x="40" y="445" width="520" height="110" rx="16" fill="#0a0e1a" stroke="#1e293b" stroke-width="1.5" />

  <text x="60" y="482" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="18" fill="#FFFFFF">
    DarkFlash DLM21 Mesh Micro-ATX Case with H
  </text>
  <text x="60" y="508" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="13" fill="#94a3b8">
    inged Door (Black)
  </text>

  <g transform="translate(380, 470)">
    <rect x="0" y="0" width="160" height="34" rx="8" fill="#1e293b" stroke="#3B82F6" stroke-width="1.5" />
    <text x="80" y="22" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="14" fill="#38bdf8">GENUINE HW</text>
  </g>
</svg>