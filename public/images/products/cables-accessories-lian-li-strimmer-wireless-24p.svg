<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#081720" stop-opacity="1" />
      <stop offset="60%" stop-color="#090d16" stop-opacity="1" />
      <stop offset="100%" stop-color="#04060a" stop-opacity="1" />
    </radialGradient>
    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00B4D8" />
      <stop offset="100%" stop-color="#90E0EF" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="600" fill="url(#bgGrad)" />

  <!-- Subtle Cybernetic Hex / Dot Grid -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="60" y1="0" x2="60" y2="600" />
    <line x1="180" y1="0" x2="180" y2="600" />
    <line x1="300" y1="0" x2="300" y2="600" />
    <line x1="420" y1="0" x2="420" y2="600" />
    <line x1="540" y1="0" x2="540" y2="600" />
    <line x1="0" y1="120" x2="600" y2="120" />
    <line x1="0" y1="240" x2="600" y2="240" />
    <line x1="0" y1="360" x2="600" y2="360" />
    <line x1="0" y1="480" x2="600" y2="480" />
  </g>

  <!-- Accent Ambient Halo Glow -->
  <circle cx="300" cy="280" r="140" fill="#00B4D8" opacity="0.15" filter="url(#glow)" />

  <!-- Outer Frame Border -->
  <rect x="20" y="20" width="560" height="560" rx="20" fill="none" stroke="#1e293b" stroke-width="2" />
  <!-- Corner Tech Accents -->
  <path d="M 20 60 L 20 20 L 60 20" fill="none" stroke="#00B4D8" stroke-width="4" />
  <path d="M 540 20 L 580 20 L 580 60" fill="none" stroke="#00B4D8" stroke-width="4" />
  <path d="M 20 540 L 20 580 L 60 580" fill="none" stroke="#90E0EF" stroke-width="4" />
  <path d="M 540 580 L 580 580 L 580 540" fill="none" stroke="#90E0EF" stroke-width="4" />

  <!-- Top Brand & Category Header -->
  <g transform="translate(45, 45)">
    <!-- Brand Badge -->
    <rect x="0" y="0" width="130" height="32" rx="8" fill="url(#brandGrad)" />
    <text x="65" y="21" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="13" fill="#FFFFFF" letter-spacing="1">LIAN LI</text>
    
    <!-- Category Pill -->
    <rect x="140" y="0" width="140" height="32" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <text x="210" y="20" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="11" fill="#94a3b8" letter-spacing="0.5">CABLES &AMP; ACCESSORIES</text>

    <!-- Verified Hardware Authentic Badge -->
    <g transform="translate(430, 6)">
      <circle cx="10" cy="10" r="10" fill="#059669" />
      <path d="M 6 10 L 9 13 L 15 7" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <text x="26" y="14" font-family="system-ui, sans-serif" font-weight="bold" font-size="11" fill="#34d399">OFFICIAL</text>
    </g>
  </g>

  <!-- Central Dynamic Vector Hardware Graphic -->
  <g id="hardware-graphic">
    
      <!-- High-End Sleeved ARGB Extension Cables -->
      <path d="M 136 170 C 176 270, 196 320, 236 420" fill="none" stroke="#00B4D8" stroke-width="10" stroke-linecap="round" opacity="0.9" /><path d="M 152 170 C 192 270, 212 320, 252 420" fill="none" stroke="#90E0EF" stroke-width="10" stroke-linecap="round" opacity="0.9" /><path d="M 168 170 C 208 270, 228 320, 268 420" fill="none" stroke="#00B4D8" stroke-width="10" stroke-linecap="round" opacity="0.9" /><path d="M 184 170 C 224 270, 244 320, 284 420" fill="none" stroke="#90E0EF" stroke-width="10" stroke-linecap="round" opacity="0.9" /><path d="M 200 170 C 240 270, 260 320, 300 420" fill="none" stroke="#00B4D8" stroke-width="10" stroke-linecap="round" opacity="0.9" /><path d="M 216 170 C 256 270, 276 320, 316 420" fill="none" stroke="#90E0EF" stroke-width="10" stroke-linecap="round" opacity="0.9" /><path d="M 232 170 C 272 270, 292 320, 332 420" fill="none" stroke="#00B4D8" stroke-width="10" stroke-linecap="round" opacity="0.9" /><path d="M 248 170 C 288 270, 308 320, 348 420" fill="none" stroke="#90E0EF" stroke-width="10" stroke-linecap="round" opacity="0.9" />
      <!-- Clear Acrylic Cable Combs -->
      <rect x="220" y="240" width="160" height="12" rx="4" fill="#ffffff" opacity="0.3" stroke="#ffffff" stroke-width="1" />
      <rect x="250" y="330" width="160" height="12" rx="4" fill="#ffffff" opacity="0.3" stroke="#ffffff" stroke-width="1" />
      <!-- Connector Plugs -->
      <rect x="170" y="160" width="140" height="18" rx="3" fill="#020617" stroke="#334155" stroke-width="2" />
      <rect x="280" y="415" width="140" height="18" rx="3" fill="#020617" stroke="#334155" stroke-width="2" />
    
  </g>

  <!-- Bottom Details Card Plate -->
  <rect x="40" y="470" width="520" height="85" rx="14" fill="#0b1120" stroke="#1e293b" stroke-width="2" />
  
  <!-- Product Name (Clipped / Scaled for fit) -->
  <text x="60" y="505" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="18" fill="#ffffff" letter-spacing="0.2">
    LIAN LI STRIMMER WIRELESS 24P
  </text>

  <!-- Type Subtitle & Pricing Badges -->
  <text x="60" y="534" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#64748b">
    ARGB Cable • Genuine Retail Box
  </text>

  <g transform="translate(360, 482)">
    <rect x="0" y="0" width="180" height="32" rx="8" fill="#1e293b" stroke="#00B4D8" stroke-width="1.5" />
    <text x="90" y="21" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="15" fill="#38bdf8">PKR 18,000</text>
    <text x="90" y="46" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="500" font-size="10" fill="#94a3b8">Walk-in: PKR 19,000</text>
  </g>

</svg>