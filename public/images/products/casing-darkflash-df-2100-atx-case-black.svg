<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#0b1329" stop-opacity="1" />
      <stop offset="60%" stop-color="#090d16" stop-opacity="1" />
      <stop offset="100%" stop-color="#04060a" stop-opacity="1" />
    </radialGradient>
    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="600" fill="url(#bgGrad)" />

  <!-- Subtle Cybernetic Hex / Dot Grid -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="60" y1="0" x2="60" y2="600" />
    <line x1="180" y1="0" x2="180" y2="600" />
    <line x1="300" y1="0" x2="300" y2="600" />
    <line x1="420" y1="0" x2="420" y2="600" />
    <line x1="540" y1="0" x2="540" y2="600" />
    <line x1="0" y1="120" x2="600" y2="120" />
    <line x1="0" y1="240" x2="600" y2="240" />
    <line x1="0" y1="360" x2="600" y2="360" />
    <line x1="0" y1="480" x2="600" y2="480" />
  </g>

  <!-- Accent Ambient Halo Glow -->
  <circle cx="300" cy="280" r="140" fill="#3B82F6" opacity="0.15" filter="url(#glow)" />

  <!-- Outer Frame Border -->
  <rect x="20" y="20" width="560" height="560" rx="20" fill="none" stroke="#1e293b" stroke-width="2" />
  <!-- Corner Tech Accents -->
  <path d="M 20 60 L 20 20 L 60 20" fill="none" stroke="#3B82F6" stroke-width="4" />
  <path d="M 540 20 L 580 20 L 580 60" fill="none" stroke="#3B82F6" stroke-width="4" />
  <path d="M 20 540 L 20 580 L 60 580" fill="none" stroke="#60A5FA" stroke-width="4" />
  <path d="M 540 580 L 580 580 L 580 540" fill="none" stroke="#60A5FA" stroke-width="4" />

  <!-- Top Brand & Category Header -->
  <g transform="translate(45, 45)">
    <!-- Brand Badge -->
    <rect x="0" y="0" width="130" height="32" rx="8" fill="url(#brandGrad)" />
    <text x="65" y="21" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="13" fill="#FFFFFF" letter-spacing="1">DARKFLASH</text>
    
    <!-- Category Pill -->
    <rect x="140" y="0" width="140" height="32" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <text x="210" y="20" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="11" fill="#94a3b8" letter-spacing="0.5">CASING</text>

    <!-- Verified Hardware Authentic Badge -->
    <g transform="translate(430, 6)">
      <circle cx="10" cy="10" r="10" fill="#059669" />
      <path d="M 6 10 L 9 13 L 15 7" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <text x="26" y="14" font-family="system-ui, sans-serif" font-weight="bold" font-size="11" fill="#34d399">OFFICIAL</text>
    </g>
  </g>

  <!-- Central Dynamic Vector Hardware Graphic -->
  <g id="hardware-graphic">
    
      <!-- PC Case Chassis -->
      <rect x="180" y="150" width="240" height="310" rx="12" fill="#0f172a" stroke="#334155" stroke-width="4" />
      <!-- Tempered Glass Window Panel -->
      <rect x="220" y="170" width="185" height="260" rx="8" fill="#1e293b" stroke="#3B82F6" stroke-width="2" opacity="0.8" />
      <!-- Inner Components Lighting Glow -->
      <rect x="240" y="240" width="140" height="40" rx="4" fill="#3B82F6" opacity="0.4" />
      <rect x="250" y="300" width="130" height="30" rx="4" fill="#60A5FA" opacity="0.4" />
      <!-- Front Mesh Panel & Dust Filter -->
      <rect x="195" y="170" width="15" height="260" rx="4" fill="#334155" />
      <line x1="198" y1="190" x2="207" y2="190" stroke="#3B82F6" stroke-width="3" /><line x1="198" y1="218" x2="207" y2="218" stroke="#3B82F6" stroke-width="3" /><line x1="198" y1="246" x2="207" y2="246" stroke="#3B82F6" stroke-width="3" /><line x1="198" y1="274" x2="207" y2="274" stroke="#3B82F6" stroke-width="3" /><line x1="198" y1="302" x2="207" y2="302" stroke="#3B82F6" stroke-width="3" /><line x1="198" y1="330" x2="207" y2="330" stroke="#3B82F6" stroke-width="3" /><line x1="198" y1="358" x2="207" y2="358" stroke="#3B82F6" stroke-width="3" /><line x1="198" y1="386" x2="207" y2="386" stroke="#3B82F6" stroke-width="3" />
      <!-- Top Power Button & Front I/O -->
      <circle cx="210" cy="160" r="4" fill="#3B82F6" />
      <rect x="225" y="158" width="12" height="4" rx="1" fill="#94a3b8" />
      <rect x="245" y="158" width="8" height="4" rx="1" fill="#94a3b8" />
      <!-- Case Feet -->
      <rect x="190" y="460" width="30" height="12" rx="3" fill="#1e293b" />
      <rect x="380" y="460" width="30" height="12" rx="3" fill="#1e293b" />
    
  </g>

  <!-- Bottom Details Card Plate -->
  <rect x="40" y="470" width="520" height="85" rx="14" fill="#0b1120" stroke="#1e293b" stroke-width="2" />
  
  <!-- Product Name (Clipped / Scaled for fit) -->
  <text x="60" y="505" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="18" fill="#ffffff" letter-spacing="0.2">
    DARKFLASH DF 2100 ATX CASE BLACK
  </text>

  <!-- Type Subtitle & Pricing Badges -->
  <text x="60" y="534" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#64748b">
    Mid Tower • Genuine Retail Box
  </text>

  <g transform="translate(360, 482)">
    <rect x="0" y="0" width="180" height="32" rx="8" fill="#1e293b" stroke="#3B82F6" stroke-width="1.5" />
    <text x="90" y="21" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="15" fill="#38bdf8">PKR 14,000</text>
    <text x="90" y="46" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="500" font-size="10" fill="#94a3b8">Walk-in: PKR 15,000</text>
  </g>

</svg>